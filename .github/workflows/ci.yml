name: CI

on:
  pull_request:
    branches: [main, 'feature/**']
  push:
    branches: [main, 'feature/**']

# Cancela ejecuciones previas de la misma rama/PR para no gastar minutos de runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # v5 es la primera version de estas acciones que corre sobre Node 24.
      # Con las @v4 el runner avisaba "Node 20 is being deprecated" en cada run.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Necesitamos el historial para diffear contra la rama base del PR
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # ── Lint incremental ────────────────────────────────────────────────
      # El repo arrastra ~815 errores de lint heredados (mayormente
      # no-explicit-any y no-unused-vars), asi que un `eslint .` bloqueante
      # dejaria todos los PRs en rojo. En su lugar solo exigimos limpieza en
      # los archivos que el PR modifica: el codigo nuevo entra sin errores y
      # la deuda se paga a medida que se tocan los archivos viejos.
      - name: Lint de archivos modificados
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || git fetch --no-tags origin "${{ github.base_ref }}"

          # Solo archivos existentes (excluye los borrados por el PR).
          # -z / xargs -0 para soportar rutas con espacios sin depender del IFS.
          git diff --name-only --diff-filter=ACMR -z "$BASE"...HEAD \
            -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.cjs' '*.mjs' > changed.z

          if [ ! -s changed.z ]; then
            echo "Este PR no modifica archivos JS/TS. Nada que lintear."
            exit 0
          fi

          echo "Lintando los archivos modificados por el PR:"
          tr '\0' '\n' < changed.z | sed 's/^/  - /'
          echo ""

          # Bloquea por ERRORES, no por warnings. El proyecto arrastra 68
          # warnings de react-hooks/exhaustive-deps que requieren revisarse hook
          # por hook; con --max-warnings=0 cualquier PR que tocara uno de esos
          # archivos saldria rojo sin haber introducido nada nuevo, que es justo
          # el modo de falla que este gate incremental busca evitar.
          xargs -0 npx eslint < changed.z

      # Panorama completo de la deuda, informativo: nunca tumba el build.
      # Reporte completo de la deuda de lint. Nunca tumba el build: existe para
      # tener el inventario de errores a mano e irlos resolviendo en la rama de
      # demo antes de mergear a main (produccion).
      - name: Lint completo (informativo)
        continue-on-error: true
        run: |
          # Los formatos van a archivo aparte: el stylish es para leer, el JSON
          # para procesar. `|| true` porque eslint sale con 1 si hay errores.
          npx eslint . -f stylish > eslint-report.txt 2>&1 || true
          npx eslint . -f json   > eslint-report.json 2>/dev/null || true

          # El desglose por regla y por archivo se calcula del JSON, que es
          # estructurado, en vez de raspar el texto del stylish.
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs'

          let results = []
          try {
            results = JSON.parse(readFileSync('eslint-report.json', 'utf8'))
          } catch {
            console.log('### Deuda de lint\n\nNo se pudo leer el reporte JSON de ESLint.')
            process.exit(0)
          }

          const root = process.cwd() + '/'
          const byRule = new Map()
          const byFile = []
          let errors = 0
          let warnings = 0

          for (const file of results) {
            if (!file.messages.length) continue
            let fe = 0
            let fw = 0
            for (const m of file.messages) {
              const isError = m.severity === 2
              isError ? errors++ : warnings++
              isError ? fe++ : fw++
              const key = `${m.ruleId ?? '(sin regla)'}|${isError ? 'error' : 'warning'}`
              byRule.set(key, (byRule.get(key) ?? 0) + 1)
            }
            byFile.push({ path: file.filePath.replace(root, ''), fe, fw })
          }

          const out = []
          out.push('### Deuda de lint en todo el repo')
          out.push('')
          out.push(`**${errors} errores** y **${warnings} warnings** en ${byFile.length} archivos.`)
          out.push('')
          out.push('Este paso no bloquea el CI. El reporte completo esta en el artifact')
          out.push('`eslint-report` de este run (stylish + JSON).')
          out.push('')

          out.push('#### Por regla')
          out.push('')
          out.push('| Regla | Severidad | Cantidad |')
          out.push('| --- | --- | --- |')
          for (const [key, count] of [...byRule].sort((a, b) => b[1] - a[1])) {
            const [rule, sev] = key.split('|')
            out.push(`| \`${rule}\` | ${sev} | ${count} |`)
          }
          out.push('')

          out.push('#### Archivos con mas errores')
          out.push('')
          out.push('| Archivo | Errores | Warnings |')
          out.push('| --- | --- | --- |')
          for (const f of byFile.sort((a, b) => b.fe - a.fe || b.fw - a.fw).slice(0, 25)) {
            out.push(`| \`${f.path}\` | ${f.fe} | ${f.fw} |`)
          }

          console.log(out.join('\n'))
          NODE

      - name: Publicar reporte de lint
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eslint-report
          path: |
            eslint-report.txt
            eslint-report.json
          retention-days: 30
          if-no-files-found: warn

      # ── Gates bloqueantes ───────────────────────────────────────────────
      - name: Typecheck
        run: npx tsc -b --force

      - name: Tests
        run: npm run test

      # El build toma las variables del `.env` versionado en el repo.
      # Cuando saquen `.env` del control de versiones (recomendado: ya esta en
      # .gitignore pero sigue trackeado), definan VITE_API_URL como repository
      # variable y pasenla aqui con `env:`.
      - name: Build
        run: npm run build
